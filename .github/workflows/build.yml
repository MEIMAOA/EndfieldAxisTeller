name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build AxisTeller/AxisTeller.csproj -c Release

      - name: Self test
        shell: pwsh
        run: |
          $exe = "AxisTeller/bin/Release/net10.0-windows/AxisTeller.exe"
          & $exe --selftest selftest-report.txt
          Get-Content selftest-report.txt
          if ($LASTEXITCODE -ne 0) { throw "self test failed (exit $LASTEXITCODE)" }

      - name: Publish
        run: dotnet publish AxisTeller/AxisTeller.csproj -c Release -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxisTeller-win-x64
          path: publish
          retention-days: 14
